name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "production or ip-test"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - ip-test

concurrency:
  group: yiduo-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Check deployment assets
        run: bash scripts/check-deploy-assets.sh

  deploy:
    name: Deploy to cloud server
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/yiduo_deploy_key
          chmod 600 ~/.ssh/yiduo_deploy_key

          SSH_PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WORKFLOW_DEPLOY_MODE: ${{ github.event.inputs.deploy_mode }}
          DEFAULT_DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
        run: |
          SSH_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_MODE="${WORKFLOW_DEPLOY_MODE:-${DEFAULT_DEPLOY_MODE:-production}}"

          case "$DEPLOY_MODE" in
            production|ip-test) ;;
            *)
              echo "Unsupported DEPLOY_MODE: $DEPLOY_MODE" >&2
              exit 1
              ;;
          esac

          ssh \
            -i ~/.ssh/yiduo_deploy_key \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/yiduo/app && DEPLOY_MODE='$DEPLOY_MODE' BRANCH='main' ./deploy/deploy.sh"
